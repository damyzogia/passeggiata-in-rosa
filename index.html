<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Passeggiata in Rosa — sito in costruzione</title>
<meta name="description" content="6ª Passeggiata in Rosa — domenica 13 settembre 2026, Borgo Veneto (PD). Sito in costruzione.">
<meta name="robots" content="noindex">
<link rel="icon" href="loghi/favicon_logo%20passeggiata%20rosa%20rotondo.png">
<style>
  :root { --rosa:#F24DAE; --grigio:#646262; }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body {
    margin:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:1.5rem; padding:2rem;
    background:#fff; color:var(--grigio);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    text-align:center;
  }
  img { width:min(320px,80vw); height:auto; }
  h1 { margin:0; font-size:clamp(1.25rem,4vw,1.75rem); font-weight:600; color:var(--rosa); }
  p { margin:0; font-size:.95rem; }
  .rule { width:64px; height:3px; border-radius:3px; background:var(--rosa); }
</style>
</head>
<body>
  <img src="loghi/logo%20passeggiata%20rosa.png" alt="Logo Passeggiata in Rosa">
  <div class="rule"></div>
  <h1>Passeggiata in Rosa — sito in costruzione</h1>
  <p>6ª edizione · domenica 13 settembre 2026 · Borgo Veneto (PD)</p>
  <p>Sito e automazioni a cura di <a href="https://heneti.it" style="color:var(--rosa)">Heneti</a></p>
</body>
</html>
